<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0d12" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Jarvis" />
  <title>Jarvis</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="top">
    <div class="orb" id="orb"></div>
    <div class="brand">Jarvis <span id="agentLabel" class="muted"></span></div>
    <button id="modelBtn" class="chip" title="AI-model">Ingen model</button>
  </header>
  <div id="progress" class="progress hidden"><div id="progressBar"></div><span id="progressText"></span></div>
  <main id="view"></main>
  <nav class="tabs" id="tabs">
    <button data-tab="chat"><span>💬</span>Chat</button>
    <button data-tab="voice"><span>🎙️</span>Stemme</button>
    <button data-tab="build"><span>📐</span>Byg</button>
    <button data-tab="code"><span>⌨️</span>Kode</button>
    <button data-tab="know"><span>📚</span>Viden</button>
    <button data-tab="tasks"><span>✅</span>Opgaver</button>
    <button data-tab="more"><span>⚙️</span>Mere</button>
  </nav>
  <div id="toast" class="toast hidden"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
