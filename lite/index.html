<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#04070e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Jarvis" />
  <title>Jarvis</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="top">
    <div class="orb" id="orb"></div>
    <div class="brand">Jarvis <span id="agentLabel" class="muted"></span></div>
    <button id="modelBtn" class="chip" title="AI-model">Ingen model</button>
  </header>
  <div id="progress" class="progress hidden"><div id="progressBar"></div><span id="progressText"></span></div>
  <main id="view"></main>
  <nav class="dock" id="tabs">
    <button data-tab="chat"><span class="ic">💬</span><label>Chat</label></button>
    <button class="fab" data-tab="voice" aria-label="Stemme"><span class="ic">🎙️</span></button>
    <button data-tab="menu"><span class="ic">⋯</span><label>Mere</label></button>
  </nav>
  <div class="sheet-wrap hidden" id="sheet">
    <div class="sheet-bg"></div>
    <div class="sheet-panel">
      <div class="sheet-grip"></div>
      <h3 style="margin:2px 0 12px">Værktøjer</h3>
      <div class="sheet-grid">
        <button data-tab="tegning"><span>📐</span>Tegning<small>CAD 2D/3D</small></button>
        <button data-tab="code"><span>⌨️</span>Kode<small>Hjemmesider</small></button>
        <button data-tab="know"><span>📚</span>Viden<small>Træn & dokumenter</small></button>
        <button data-tab="tasks"><span>✅</span>Opgaver<small>Planlæg & påmind</small></button>
        <button data-tab="more"><span>⚙️</span>Indstillinger<small>Model, data, backup</small></button>
      </div>
    </div>
  </div>
  <div id="toast" class="toast hidden"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
