# Udgiver Jarvis Lite (mappen lite/) på GitHub Pages ved hvert push til main.
name: Udgiv Jarvis Lite
on:
  push:
    branches: [main]
    paths: ["lite/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cd lite && node --test tests/lite.test.js
  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with: { enablement: true }
      - run: rm -rf lite/tests lite/package.json
      - uses: actions/upload-pages-artifact@v3
        with: { path: lite }
      - id: d
        uses: actions/deploy-pages@v4
